<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tide</title>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="switch">
          <button id="tab-files" type="button">Programs</button>
          <button id="tab-catalog" type="button" title="Catalog (Ctrl+J)">Catalog</button>
        </div>

        <div class="pane" id="pane-files">
          <input id="find" placeholder="Find or create a program…" title="Enter opens the first match, or creates it if there is none. Ctrl+Enter always creates." spellcheck="false" />
          <div class="files">
            <ul id="list"></ul>
            <p class="hint" id="list-empty" hidden>
              Nothing yet. Type a name and press Enter to create one.
            </p>
            <div class="project-head">
              <span id="project-name">No folder open</span>
              <button id="open-folder" type="button">Open folder</button>
            </div>
            <ul id="tree"></ul>
            <p class="hint" id="tree-empty" hidden>Open a folder to see its files here.</p>
          </div>
        </div>

        <div class="pane" id="pane-catalog" hidden>
          <input id="cat-find" placeholder="Search commands…" spellcheck="false" />
          <div id="catalog"></div>
        </div>
      </aside>

      <section class="workspace">
        <div class="tabs" id="tabs"></div>
        <div class="stage">
          <div id="editor"></div>
          <div class="empty" id="empty">
            <strong>Tide</strong>
            <span class="hint">Open a program from the list, or type a name and press Enter.</span>
          </div>
        </div>
        <div class="status">
          <span id="status-msg"></span>
          <button id="export" type="button" title="Ctrl+E rebuilds to the same file. Ctrl+Shift+E picks a new location." hidden>Build .8xp</button>
          <button id="gutter" type="button">Gutter: ":"</button>
          <button id="problems" type="button" hidden>No problems</button>
          <span class="spacer"></span>
          <span id="status-pos"></span>
          <span id="status-size"></span>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
