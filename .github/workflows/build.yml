name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare latest release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the history to move the "latest" tag safely

      - name: Move the tag, create or refresh the release, clear stale assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$SHA"
          git push -f origin refs/tags/latest

          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            # Wipe old assets so the release always mirrors exactly the newest build.
            gh release view latest --repo "$REPO" --json assets --jq '.assets[].name' \
              | while IFS= read -r asset; do
                  [ -z "$asset" ] && continue
                  gh release delete-asset latest "$asset" --repo "$REPO" --yes
                done
            gh release edit latest --repo "$REPO" \
              --title "Latest Build" \
              --notes "Latest automated build from commit $SHA" \
              --latest
          else
            gh release create latest --repo "$REPO" \
              --title "Latest Build" \
              --notes "Latest automated build from commit $SHA" \
              --latest --verify-tag
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - name: Build app
        uses: tauri-apps/tauri-action@v0

      - name: Upload installers to the latest release
        shell: bash   # the default on Windows is PowerShell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found under src-tauri/target/release/bundle"
            find src-tauri/target/release/bundle -type f || true
            exit 1
          fi
          printf 'Uploading: %s\n' "${files[@]}"
          gh release upload latest "${files[@]}" --repo "$REPO" --clobber