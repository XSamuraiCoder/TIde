name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm ci

      - name: Build app
        uses: tauri-apps/tauri-action@v0

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tide-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    name: Publish Latest Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: tide-*
          path: release-assets
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the history to move the "latest" tag safely

      - name: Point the latest tag at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest

      - name: Collect installer files
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No installer files were downloaded. Check that the build jobs uploaded their artifacts."
            exit 1
          fi
          printf '%s\n' "${assets[@]}" > assets.txt
          cat assets.txt

      - name: Publish or update the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t assets < assets.txt

          # The tag is moved to the built commit first; gh release create reuses it.
          git tag -f latest "$SHA"
          git push -f origin refs/tags/latest

          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            echo "Release 'latest' exists — uploading assets over it."
            gh release upload latest "${assets[@]}" --clobber --repo "$REPO"
            gh release edit latest --repo "$REPO" \
              --title "Latest Build" \
              --notes "Latest automated build from commit $SHA" --latest
          else
            echo "Release 'latest' not found — creating it."
            gh release create latest "${assets[@]}" \
              --repo "$REPO" \
              --title "Latest Build" \
              --notes "Latest automated build from commit $SHA" \
              --latest
          fi