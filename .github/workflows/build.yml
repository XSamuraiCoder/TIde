name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare latest release
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.start.outputs.started }}
      version: ${{ steps.start.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Note the start time and version, and create the release if it doesn't exist
        id: start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # The release is the version in tauri.conf.json. Installed apps update when it goes up.
          echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
          if ! gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create latest --repo "$REPO" \
              --title "Latest Build" \
              --notes "Latest automated build from commit $SHA" \
              --target "$SHA" --latest
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            target: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            target: ""
          - name: MacOS (Apple Silicon)
            os: macos-15
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: MacOS (Intel)
            os: macos-15
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Set this build's version and turn on signed update files
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true}}' "$VERSION" > src-tauri/tauri.ci.conf.json

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json

      - name: Upload installers to the latest release
        shell: bash   # the default on Windows is PowerShell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="$VERSION"
          extras=src-tauri/target/release-extras
          mkdir -p "$extras"

          # The exe has the frontend built in, so it runs on its own without an installer.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/tide.exe "$extras/TIde_${version}_x64-portable.exe"
          fi

          # A .app is a folder, so it has to be zipped to upload. ditto keeps its symlinks and permissions.
          if [ "$RUNNER_OS" = "macOS" ]; then
            case "$TARGET" in
              aarch64-*) arch=aarch64 ;;
              *) arch=x64 ;;
            esac
            bundle="src-tauri/target/$TARGET/release/bundle/macos"
            ditto -c -k --keepParent "$bundle/TIde.app" "$extras/TIde_${version}_${arch}.app.zip"
            # The updater's archive has the same name on both Macs, so give it the version and architecture.
            cp "$bundle/TIde.app.tar.gz" "$extras/TIde_${version}_${arch}.app.tar.gz"
            cp "$bundle/TIde.app.tar.gz.sig" "$extras/TIde_${version}_${arch}.app.tar.gz.sig"
          fi

          files=(
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/*/*.sig
            "$extras"/*
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found under src-tauri/target"
            find src-tauri/target -path '*/bundle/*' -type f || true
            exit 1
          fi
          printf 'Uploading: %s\n' "${files[@]}"
          gh release upload latest "${files[@]}" --repo "$REPO" --clobber

  finish:
    name: Finish latest release
    # Runs only if every platform built, so a failed build keeps that platform's old installers.
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the history to move the "latest" tag safely

      - name: Move the tag, refresh the release, clear stale assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STARTED: ${{ needs.prepare.outputs.started }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$SHA"
          git push -f origin refs/tags/latest

          # The release text is RELEASE_NOTES.md, which the app also shows when it offers the update.
          printf '%s\n\n---\nTIde %s, built from commit %s.\n' "$(cat RELEASE_NOTES.md)" "$VERSION" "$SHA" > body.md
          gh release edit latest --repo "$REPO" --title "TIde v$VERSION" --notes-file body.md --latest

          # latest.json tells installed apps about this version: one signed download per platform.
          mkdir -p sigs
          gh release download latest --repo "$REPO" --pattern "*_${VERSION}_*.sig" --dir sigs
          node -e '
            const fs = require("fs");
            const kinds = [[/_x64-setup\.exe\.sig$/, "windows-x86_64"], [/_aarch64\.app\.tar\.gz\.sig$/, "darwin-aarch64"],
                           [/_x64\.app\.tar\.gz\.sig$/, "darwin-x86_64"], [/_amd64\.AppImage\.sig$/, "linux-x86_64"]];
            const platforms = {};
            for (const file of fs.readdirSync("sigs")) {
              const kind = kinds.find(([re]) => re.test(file));
              if (!kind) continue;
              platforms[kind[1]] = {
                signature: fs.readFileSync("sigs/" + file, "utf8").trim(),
                url: `https://github.com/${process.env.REPO}/releases/download/latest/${file.slice(0, -4)}`,
              };
            }
            if (Object.keys(platforms).length < kinds.length) console.log("::warning::latest.json covers only " + Object.keys(platforms).join(", "));
            const notes = fs.readFileSync("RELEASE_NOTES.md", "utf8").trim();
            fs.writeFileSync("latest.json", JSON.stringify({ version: process.env.VERSION, notes, pub_date: new Date().toISOString(), platforms }, null, 2));
          '
          gh release upload latest latest.json --repo "$REPO" --clobber

          # Anything not uploaded by this run is left over from an older build.
          gh release view latest --repo "$REPO" --json assets \
            | jq -r --arg started "$STARTED" '.assets[] | select(.updatedAt < $started) | .name' \
            | while IFS= read -r asset; do
                [ -z "$asset" ] && continue
                echo "Removing stale asset: $asset"
                gh release delete-asset latest "$asset" --repo "$REPO" --yes
              done